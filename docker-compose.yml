services:
  db:
    image: postgres:16-bookworm
    container_name: izlk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: izlk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: izlk
    volumes:
      - izlk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izlk -d izlk"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: izlk-app:latest
    container_name: izlk-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://izlk:${POSTGRES_PASSWORD}@db:5432/izlk
      STORAGE_PATH: /app/storage
      INBOX_PATH: /app/inbox
    command: sh -c "npx prisma migrate deploy && npm run start"
    ports:
      - "80:3000"
    volumes:
      - izlk-storage:/app/storage
      - izlk-inbox:/app/inbox
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  watcher:
    image: izlk-app:latest
    container_name: izlk-watcher
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://izlk:${POSTGRES_PASSWORD}@db:5432/izlk
      STORAGE_PATH: /app/storage
      INBOX_PATH: /app/inbox
      INBOX_SCAN_INTERVAL_MS: 5000
    command: npm run watch:inbox
    volumes:
      - izlk-storage:/app/storage
      - izlk-inbox:/app/inbox

volumes:
  izlk-db:
  izlk-storage:
  izlk-inbox:
